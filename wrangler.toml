const HTML = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابزارک هوش مصنوعی</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 25px 15px;
}

.box {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 150px;
  padding: 15px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
  font-family: Tahoma, Arial, sans-serif;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #f9fafb;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.9;
  min-height: 50px;
}

.status {
  text-align: center;
  color: #6b7280;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">

    <h1>🤖 ابزارک هوش مصنوعی</h1>

    <textarea
      id="prompt"
      placeholder="سؤال یا درخواست خود را بنویسید..."
    ></textarea>

    <button id="send">
      ارسال به هوش مصنوعی
    </button>

    <div class="status" id="status">
      آماده است
    </div>

    <div id="result"></div>

  </div>
</div>

<script>
const promptBox = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const result = document.getElementById("result");
const status = document.getElementById("status");

sendButton.addEventListener("click", async () => {

  const prompt = promptBox.value.trim();

  if (!prompt) {
    result.textContent = "لطفاً متن خود را وارد کنید.";
    return;
  }

  sendButton.disabled = true;
  status.textContent = "در حال دریافت پاسخ...";
  result.textContent = "";

  try {

    const response = await fetch("/api/ai", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "خطایی در دریافت پاسخ رخ داد."
      );
    }

    result.textContent =
      data.answer || "پاسخی دریافت نشد.";

    status.textContent = "پاسخ آماده است ✅";

  } catch (error) {

    result.textContent =
      "خطا: " + error.message;

    status.textContent = "خطا ❌";

  } finally {

    sendButton.disabled = false;

  }

});
</script>

</body>
</html>`;

export default {

  async fetch(request, env) {

    const url = new URL(request.url);

    // صفحه اصلی
    if (
      request.method === "GET" &&
      url.pathname === "/"
    ) {
      return new Response(HTML, {
        headers: {
          "Content-Type": "text/html; charset=UTF-8"
        }
      });
    }

    // درخواست هوش مصنوعی
    if (
      request.method === "POST" &&
      url.pathname === "/api/ai"
    ) {

      try {

        const body = await request.json();

        const prompt =
          typeof body.prompt === "string"
            ? body.prompt.trim()
            : "";

        if (!prompt) {
          return Response.json(
            {
              error: "لطفاً متن خود را وارد کنید."
            },
            {
              status: 400
            }
          );
        }

        if (!env.AI) {
          return Response.json(
            {
              error:
                "اتصال AI در Cloudflare تنظیم نشده است."
            },
            {
              status: 500
            }
          );
        }

        const response = await env.AI.run(
          "openai/gpt-5.6-sol",
          {
            input: prompt,
            instructions:
              "به زبان فارسی پاسخ بده. پاسخ را واضح، دقیق و کاربردی ارائه کن.",
            max_output_tokens: 1024,
            reasoning: {
              effort: "medium"
            }
          }
        );

        return Response.json({
          answer:
            response.output_text ||
            "پاسخی دریافت نشد."
        });

      } catch (error) {

        return Response.json(
          {
            error:
              "خطا در اتصال به هوش مصنوعی: " +
              (error.message || "خطای نامشخص")
          },
          {
            status: 500
          }
        );
      }
    }

    return new Response(
      "Not Found",
      {
        status: 404
      }
    );
  }
};
