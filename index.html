<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزارک | ابزارهای آنلاین رایگان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 30px 15px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .tool {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .tool h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d5dbe5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 10px;
      padding: 12px;
      background: #eef2ff;
      border-radius: 10px;
      min-height: 42px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>ابزارک</h1>
  <p>ابزارهای آنلاین رایگان و کاربردی</p>
</header>

<main>

  <div class="intro">
    <h2>ابزارهای رایگان</h2>
    <p>ابزار مورد نیازت را انتخاب کن.</p>
  </div>

  <div class="tools">

    <div class="tool">
      <h2>🧮 محاسبه‌گر</h2>

      <input
        id="calculator"
        type="text"
        placeholder="مثلاً 25*4+10">

      <button onclick="calculate()">محاسبه</button>

      <div class="result" id="calcResult"></div>
    </div>


    <div class="tool">
      <h2>📝 شمارش متن</h2>

      <textarea
        id="text"
        placeholder="متن خود را وارد کنید..."
        oninput="countText()"></textarea>

      <div class="result" id="countResult">
        کلمات: ۰ | کاراکترها: ۰
      </div>
    </div>


    <div class="tool">
      <h2>🔠 تبدیل به حروف بزرگ</h2>

      <textarea
        id="upperInput"
        placeholder="متن انگلیسی را وارد کنید..."></textarea>

      <button onclick="makeUpper()">تبدیل</button>

      <textarea
        id="upperOutput"
        readonly></textarea>
    </div>


    <div class="tool">
      <h2>🔐 تولید رمز عبور</h2>

      <input
        id="passwordLength"
        type="number"
        min="6"
        max="64"
        value="16">

      <button onclick="generatePassword()">تولید رمز</button>

      <input
        id="password"
        readonly
        placeholder="رمز اینجا نمایش داده می‌شود">
    </div>

  </div>

</main>

<footer>
  © 2026 ابزارک
</footer>


<script>

function calculate() {

  const input =
    document.getElementById("calculator").value;

  const result =
    document.getElementById("calcResult");

  if (!/^[0-9+\-*/().%\s]+$/.test(input)) {
    result.textContent = "عبارت نامعتبر است.";
    return;
  }

  try {

    const answer =
      Function('"use strict"; return (' + input + ')')();

    result.textContent =
      Number.isFinite(answer)
        ? answer
        : "نتیجه نامعتبر است.";

  } catch {

    result.textContent =
      "لطفاً عبارت را بررسی کنید.";

  }
}


function countText() {

  const text =
    document.getElementById("text").value;

  const words =
    text.trim()
      ? text.trim().split(/\s+/).length
      : 0;

  document.getElementById("countResult").textContent =
    "کلمات: " +
    words.toLocaleString("fa-IR") +
    " | کاراکترها: " +
    text.length.toLocaleString("fa-IR");
}


function makeUpper() {

  const input =
    document.getElementById("upperInput").value;

  document.getElementById("upperOutput").value =
    input.toUpperCase();
}


function generatePassword() {

  const length =
    Math.min(
      64,
      Math.max(
        6,
        parseInt(
          document.getElementById("passwordLength").value
        ) || 16
      )
    );

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";

  let password = "";

  for (let i = 0; i < length; i++) {

    password +=
      chars[Math.floor(Math.random() * chars.length)];

  }

  document.getElementById("password").value =
    password;
}

</script>

</body>
</html>
