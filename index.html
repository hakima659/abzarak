<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابزارک | ابزارهای رایگان آنلاین</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:#2563eb;color:white;padding:28px 16px;text-align:center}
header h1{margin:0 0 10px}
main{max-width:900px;margin:25px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #00000012}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
textarea{min-height:100px}
button{background:#2563eb;color:white;border:0;font-weight:bold}
.result{background:#f1f5f9;padding:12px;border-radius:10px;margin-top:8px;min-height:25px}
footer{text-align:center;padding:30px;color:#666}
</style>
</head>

<body>

<header>
<h1>ابزارک</h1>
<p>ابزارهای رایگان برای کار و درآمد آنلاین</p>
</header>

<main>
<h2>ابزارهای کاربردی، رایگان و سریع</h2>

<div class="grid">

<section class="card">
<h2>محاسبه درصد</h2>
<input id="num" type="number" placeholder="عدد">
<input id="per" type="number" placeholder="درصد">
<button onclick="percent()">محاسبه</button>
<div class="result" id="r1"></div>
</section>

<section class="card">
<h2>تبدیل دلار به تومان</h2>
<input id="usd" type="number" placeholder="مقدار دلار">
<input id="rate" type="number" placeholder="قیمت دلار">
<button onclick="dollar()">محاسبه</button>
<div class="result" id="r2"></div>
</section>

<section class="card">
<h2>محاسبه تخفیف</h2>
<input id="price" type="number" placeholder="قیمت کالا">
<input id="discount" type="number" placeholder="درصد تخفیف">
<button onclick="off()">محاسبه</button>
<div class="result" id="r3"></div>
</section>

<section class="card">
<h2>محاسبه سود</h2>
<input id="capital" type="number" placeholder="سرمایه">
<input id="profit" type="number" placeholder="درصد سود">
<button onclick="profitCalc()">محاسبه</button>
<div class="result" id="r4"></div>
</section>

<section class="card">
<h2>تبدیل کیلومتر به متر</h2>
<input id="km" type="number" placeholder="کیلومتر">
<button onclick="kmToM()">تبدیل</button>
<div class="result" id="r5"></div>
</section>

<section class="card">
<h2>محاسبه اقساط</h2>
<input id="loan" type="number" placeholder="مبلغ وام">
<input id="months" type="number" placeholder="تعداد ماه">
<button onclick="loanCalc()">محاسبه</button>
<div class="result" id="r6"></div>
</section>

</div>
</main>

<footer>
ابزارک — نسخه رایگان و قابل توسعه
</footer>

<script>
function v(id){
return Number(document.getElementById(id).value)||0;
}

function percent(){
document.getElementById("r1").textContent=
"نتیجه: "+(v("num")*v("per")/100).toLocaleString("fa-IR");
}

function dollar(){
document.getElementById("r2").textContent=
"مبلغ: "+(v("usd")*v("rate")).toLocaleString("fa-IR")+" تومان";
}

function off(){
let p=v("price"),d=v("discount");
let x=p*d/100;
document.getElementById("r3").textContent=
"تخفیف: "+x.toLocaleString("fa-IR")+" تومان | قیمت نهایی: "+(p-x).toLocaleString("fa-IR")+" تومان";
}

function profitCalc(){
let c=v("capital"),p=v("profit");
let x=c*p/100;
document.getElementById("r4").textContent=
"سود: "+x.toLocaleString("fa-IR")+" تومان | مجموع: "+(c+x).toLocaleString("fa-IR")+" تومان";
}

function kmToM(){
document.getElementById("r5").textContent=
(v("km")*1000).toLocaleString("fa-IR")+" متر";
}

function loanCalc(){
let l=v("loan"),m=v("months");
let x=m?l/m:0;
document.getElementById("r6").textContent=
"قسط تقریبی ماهانه: "+x.toLocaleString("fa-IR")+" تومان";
}
</script>

</body>
</html>
